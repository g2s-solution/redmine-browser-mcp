name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match the extension version
        run: |
          version="v$(node -p "require('./extension/manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension/manifest.json version $version" >&2
            exit 1
          fi
      - name: Verify
        run: npm run ci
      - name: Package the extension
        run: |
          cd extension/dist
          zip -r "../../redmine-bridge-extension-$GITHUB_REF_NAME.zip" .
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "redmine-bridge-extension-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
